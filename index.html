<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171C" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Songbook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Geoff &amp; Kris Songbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* --- host reset (the artifact runtime used to supply this) --- */
  :root {
    color-scheme: light dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  :root {
    --bg:        #F7F5F1;
    --surface:   #FFFFFF;
    --surface-2: #F1EEE8;
    --ink:       #22262F;
    --muted:     #6E7079;
    --line:      #E3DED4;
    --brass:     #8F6326;
    --brass-bg:  #F3E8D6;
    --on-brass:  #FFFDF8;
    --ready:     #2F6B45;
    --ready-bg:  #DFEDE3;
    --learning:  #2F5C8F;
    --learn-bg:  #DEE8F3;
    --parked:    #76757E;
    --parked-bg: #E9E7E3;
    --danger:    #9B3330;
    --shadow:    0 1px 2px rgba(34,38,47,.06), 0 8px 24px rgba(34,38,47,.07);

    --lyric-size: 20px;
    --radius: 10px;

    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #15171C;
      --surface:   #1E2127;
      --surface-2: #252931;
      --ink:       #E9E7E2;
      --muted:     #9B9EA7;
      --line:      #2F333C;
      --brass:     #DCA656;
      --brass-bg:  #3A2D18;
      --on-brass:  #1A1206;
      --ready:     #79C293;
      --ready-bg:  #1E3327;
      --learning:  #86B2E2;
      --learn-bg:  #1C2B3B;
      --parked:    #8E919A;
      --parked-bg: #272A31;
      --danger:    #E08A86;
      --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg:        #15171C;
    --surface:   #1E2127;
    --surface-2: #252931;
    --ink:       #E9E7E2;
    --muted:     #9B9EA7;
    --line:      #2F333C;
    --brass:     #DCA656;
    --brass-bg:  #3A2D18;
    --on-brass:  #1A1206;
    --ready:     #79C293;
    --ready-bg:  #1E3327;
    --learning:  #86B2E2;
    --learn-bg:  #1C2B3B;
    --parked:    #8E919A;
    --parked-bg: #272A31;
    --danger:    #E08A86;
    --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  button, input, select, textarea { font: inherit; color: inherit; }

  :focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* ---------- shell ---------- */

  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 0 48px;
  }

  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding-block: 14px 10px;
  }

  .brandrow {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .brand {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 26px;
    letter-spacing: -0.015em;
    margin: 0;
  }

  .count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .authbox {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .whoami {
    font-size: 12px;
    color: var(--muted);
    max-width: 16ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .btn-sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }

  .controls {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .search {
    flex: 1 1 auto;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 9px 12px;
    font-size: 15px;
  }
  .search::placeholder { color: var(--muted); }

  .btn {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: var(--radius);
    padding: 9px 14px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn-primary {
    background: var(--brass);
    border-color: var(--brass);
    color: var(--on-brass);
  }
  .btn-primary:hover { filter: brightness(1.06); background: var(--brass); }
  .btn-quiet { border-color: transparent; background: transparent; color: var(--muted); }
  .btn-quiet:hover { background: var(--surface-2); color: var(--ink); }
  .btn-danger { color: var(--danger); border-color: transparent; background: transparent; }
  .btn-danger:hover { background: var(--surface-2); }

  .filters {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .chip {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 11px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }

  /* ---------- list ---------- */

  .list { display: flex; flex-direction: column; }

  .song {
    display: grid;
    grid-template-columns: 10px 1fr auto;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--line);
    padding: 14px 2px;
    cursor: pointer;
  }
  .song:hover { background: var(--surface-2); }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--parked);
  }
  .dot.ready    { background: var(--ready); }
  .dot.learning { background: var(--learning); }

  .song-main { min-width: 0; }

  .song-title {
    display: block;
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.01em;
    overflow-wrap: break-word;
  }

  .song-artist {
    display: block;
    font-size: 13px;
    color: var(--muted);
    overflow-wrap: break-word;
  }

  .meta { display: flex; gap: 6px; align-items: center; }

  .key {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 13px;
    color: var(--brass);
    background: var(--brass-bg);
    border-radius: 6px;
    padding: 3px 8px;
    white-space: nowrap;
  }

  .tuning {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--brass);
    border: 1px solid var(--brass);
    border-radius: 6px;
    padding: 2px 7px;
    white-space: nowrap;
  }

  .capo {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 2px 7px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .empty {
    text-align: center;
    padding: 56px 16px;
    color: var(--muted);
  }
  .empty h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 20px;
    color: var(--ink);
    margin: 0 0 6px;
  }
  .empty p { margin: 0 auto 18px; max-width: 34ch; font-size: 14px; }

  .catchup-prompt {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--brass-bg);
    border-radius: var(--radius);
    padding: 9px 12px;
    margin-top: 12px;
    font-size: 13.5px;
    color: var(--brass);
  }
  .catchup-prompt .spacer { flex: 1 1 auto; }

  .cu-song {
    padding: 18px 0 12px;
    border-bottom: 1px solid var(--line);
  }
  .cu-title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 23px;
    letter-spacing: -0.015em;
    margin: 0;
    text-wrap: balance;
  }
  .cu-sub {
    color: var(--muted);
    font-size: 13.5px;
    margin-top: 3px;
  }
  .cu-sub .m {
    font-family: var(--mono);
    color: var(--brass);
  }
  #cu-text {
    width: 100%;
    min-height: 320px;
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    font-size: 16px;
    line-height: 1.55;
    resize: vertical;
  }
  .cu-progress {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .cu-done {
    text-align: center;
    padding: 64px 16px;
  }
  .cu-done h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 22px;
    margin: 0 0 6px;
  }
  .cu-done p { color: var(--muted); font-size: 14px; margin: 0; }

  .notice {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--brass);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13.5px;
    color: var(--muted);
    margin-top: 14px;
  }

  /* ---------- overlays ---------- */

  .sheet {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }

  .sheet-bar {
    flex: 0 0 auto;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sheet-bar .spacer { flex: 1 1 auto; }

  .sheet-body {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 16px;
    padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  }
  .sheet-inner { max-width: 680px; margin: 0 auto; }

  /* performance view */

  .perf-head { padding: 18px 0 14px; border-bottom: 1px solid var(--line); }

  .perf-title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 27px;
    line-height: 1.18;
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
  }
  .perf-artist { color: var(--muted); font-size: 14px; margin-top: 3px; }

  .perf-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: stretch;
    margin-top: 14px;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 14px;
    min-width: 76px;
  }
  .stat .lbl {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat .val {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 21px;
    line-height: 1.25;
    font-variant-numeric: tabular-nums;
  }
  .stat.key-stat { background: var(--brass-bg); border-color: transparent; }
  .stat.tuning-stat .val { font-size: 15px; padding-block: 3px; }
  .stat.key-stat .val { color: var(--brass); }
  .stat.key-stat .lbl { color: var(--brass); opacity: .8; }

  .status-tag {
    align-self: center;
    margin-left: auto;
    font-size: 12px;
    font-weight: 500;
    border-radius: 999px;
    padding: 4px 11px;
    background: var(--parked-bg);
    color: var(--parked);
    white-space: nowrap;
  }
  .status-tag.ready    { background: var(--ready-bg);  color: var(--ready); }
  .status-tag.learning { background: var(--learn-bg);  color: var(--learning); }

  .notes {
    background: var(--surface-2);
    border-left: 3px solid var(--brass);
    border-radius: 0 6px 6px 0;
    padding: 11px 14px;
    margin: 18px 0 4px;
    font-size: 14.5px;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .notes .lbl {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--brass);
    display: block;
    margin-bottom: 4px;
  }

  .lyrics {
    font-size: var(--lyric-size);
    line-height: 1.62;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    padding: 20px 0 0;
    max-width: 42ch;
  }
  .lyrics.blank { color: var(--muted); font-size: 15px; font-style: italic; }

  .sizer { display: flex; gap: 2px; align-items: center; }
  .sizer button {
    border: 1px solid var(--line);
    background: var(--surface);
    width: 34px; height: 34px;
    border-radius: 8px;
    cursor: pointer;
    font-family: var(--mono);
    line-height: 1;
  }
  .sizer button:hover { background: var(--surface-2); }
  .sizer .a-sm { font-size: 12px; }
  .sizer .a-lg { font-size: 17px; }

  .awake {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* edit form */

  .form { padding: 18px 0 0; display: flex; flex-direction: column; gap: 16px; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .field input, .field textarea, .field select {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-size: 16px;
    width: 100%;
  }
  .field textarea { resize: vertical; line-height: 1.55; }
  #f-lyrics { min-height: 260px; font-size: 16px; }
  #f-notes  { min-height: 86px; }

  .row2 { display: flex; gap: 12px; }
  .row2 > .field { flex: 1 1 0; min-width: 0; }

  .form-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    padding-top: 4px;
    flex-wrap: wrap;
  }
  .form-actions .spacer { flex: 1 1 auto; }

  .confirm {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 14px;
    color: var(--danger);
    flex-wrap: wrap;
  }

  .err {
    color: var(--danger);
    font-size: 13.5px;
    min-height: 1em;
  }

  @media (max-width: 420px) {
    .brand { font-size: 23px; }
    .perf-title { font-size: 24px; }
    .stat { min-width: 68px; padding: 7px 11px; }
    .stat .val { font-size: 19px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brandrow">
      <h1 class="brand">Songbook</h1>
      <span class="authbox">
        <span class="count" id="count">loading…</span>
        <span class="whoami" id="whoami" hidden></span>
        <button class="btn btn-sm btn-primary" id="signin" hidden>Sign in to edit</button>
        <button class="btn btn-sm btn-quiet" id="signout" hidden>Sign out</button>
      </span>
    </div>
    <div class="controls">
      <input class="search" id="search" type="search" placeholder="Search titles, artists, lyrics" autocomplete="off">
      <button class="btn btn-primary" id="add" hidden>Add song</button>
    </div>
    <div class="filters" id="filters">
      <button class="chip" id="f-all"      data-filter="all"      aria-pressed="true">All</button>
      <button class="chip" id="f-learning" data-filter="learning" aria-pressed="false">Learning</button>
      <button class="chip" id="f-ready"    data-filter="ready"    aria-pressed="false">Ready</button>
      <button class="chip" id="f-parked"   data-filter="parked"   aria-pressed="false">Parked</button>
    </div>
  </header>

  <main>
    <div class="catchup-prompt" id="catchup-prompt" hidden></div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" hidden></div>
    <div class="notice" id="notice" hidden></div>
  </main>
</div>

<!-- performance view -->
<section class="sheet" id="perf" hidden aria-label="Song">
  <div class="sheet-bar">
    <button class="btn btn-quiet" id="perf-back">‹ Songs</button>
    <span class="spacer"></span>
    <span class="awake" id="awake" hidden>screen on</span>
    <div class="sizer">
      <button class="a-sm" id="size-down" aria-label="Smaller lyrics">A</button>
      <button class="a-lg" id="size-up" aria-label="Larger lyrics">A</button>
    </div>
    <button class="btn" id="perf-edit" hidden>Edit</button>
  </div>
  <div class="sheet-body">
    <div class="sheet-inner" id="perf-inner"></div>
  </div>
</section>

<!-- lyrics catch-up -->
<section class="sheet" id="catchup" hidden aria-label="Add lyrics">
  <div class="sheet-bar">
    <button class="btn btn-quiet" id="cu-close">Done</button>
    <span class="spacer"></span>
    <span class="cu-progress" id="cu-progress"></span>
    <button class="btn" id="cu-skip">Skip</button>
    <button class="btn btn-primary" id="cu-save">Save</button>
  </div>
  <div class="sheet-body">
    <div class="sheet-inner" id="cu-inner"></div>
  </div>
</section>

<!-- edit view -->
<section class="sheet" id="edit" hidden aria-label="Edit song">
  <div class="sheet-bar">
    <button class="btn btn-quiet" id="edit-cancel">Cancel</button>
    <span class="spacer"></span>
    <button class="btn btn-primary" id="edit-save">Save</button>
  </div>
  <div class="sheet-body">
    <div class="sheet-inner">
      <form class="form" id="form" autocomplete="off">
        <div class="field">
          <label for="f-title">Title</label>
          <input id="f-title" type="text" required>
        </div>
        <div class="field">
          <label for="f-artist">Artist</label>
          <input id="f-artist" type="text" placeholder="optional">
        </div>
        <div class="row2">
          <div class="field">
            <label for="f-key">Key</label>
            <input id="f-key" type="text" list="keylist" placeholder="G">
            <datalist id="keylist">
              <option value="C"></option><option value="C#"></option><option value="Db"></option>
              <option value="D"></option><option value="Eb"></option><option value="E"></option>
              <option value="F"></option><option value="F#"></option><option value="G"></option>
              <option value="Ab"></option><option value="A"></option><option value="Bb"></option>
              <option value="B"></option>
              <option value="Am"></option><option value="Bm"></option><option value="Cm"></option>
              <option value="Dm"></option><option value="Em"></option><option value="Fm"></option>
              <option value="Gm"></option>
            </datalist>
          </div>
          <div class="field">
            <label for="f-capo">Capo (fret)</label>
            <input id="f-capo" type="number" min="0" max="12" step="1" placeholder="0">
          </div>
          <div class="field">
            <label for="f-status">Status</label>
            <select id="f-status">
              <option value="learning">Learning</option>
              <option value="ready">Ready</option>
              <option value="parked">Parked</option>
            </select>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label for="f-bpm">Tempo (bpm)</label>
            <input id="f-bpm" type="number" min="20" max="300" step="1" placeholder="optional">
          </div>
          <div class="field">
            <label for="f-tuning">Tuning</label>
            <input id="f-tuning" type="text" list="tuninglist" placeholder="standard">
            <datalist id="tuninglist">
              <option value="Drop D"></option><option value="DADGAD"></option>
              <option value="Open G"></option><option value="Open D"></option>
              <option value="Half step down"></option>
            </datalist>
          </div>
        </div>
        <div class="field">
          <label for="f-notes">Notes</label>
